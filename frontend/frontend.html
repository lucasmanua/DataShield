<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataShield - Panel de Fraude Digital</title>
    <style>
        :root {
            --bg: #0b1020;
            --surface: #101935;
            --surface-2: #132044;
            --text: #edf2ff;
            --muted: #a3afd1;
            --border: #2b3864;
            --primary: #6ea8fe;
            --primary-2: #4f8df5;
            --success: #53d28c;
            --danger: #ff8ca1;
            --radius: 15px;
            --shadow: 0 24px 48px rgba(5, 10, 24, 0.45);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 14px;
            background:
                radial-gradient(circle at top left, rgba(110, 168, 254, 0.2), transparent 35%),
                radial-gradient(circle at top right, rgba(120, 139, 255, 0.22), transparent 38%),
                linear-gradient(180deg, #172140 0%, var(--bg) 30%);
            color: var(--text);
            font-family: Inter, "Segoe UI", Roboto, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 22px;
            border-radius: var(--radius);
            border: 1px solid rgba(110, 168, 254, 0.18);
            background: linear-gradient(180deg, #111c3b 0%, #0f1936 100%);
            box-shadow: var(--shadow);
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.45rem, 2.3vw, 2rem);
            letter-spacing: -0.02em;
        }

        .lead {
            margin: 0 0 18px;
            color: var(--muted);
        }

        .split {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .panel {
            border: 1px solid var(--border);
            background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);
            border-radius: 12px;
            padding: 14px;
        }

        h2 {
            margin: 6px 0 10px;
            letter-spacing: -0.01em;
        }

        label {
            display: block;
            color: var(--muted);
            margin: 4px 0 6px;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        input, textarea, button {
            width: 100%;
            margin: 0 0 10px;
        }

        input, textarea {
            padding: 11px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0b1430;
            color: var(--text);
            outline: none;
            transition: border-color .16s ease, box-shadow .16s ease;
        }

        input::placeholder, textarea::placeholder { color: #7f8cb0; }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(110, 168, 254, 0.24);
        }

        button {
            padding: 11px 14px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-2) 100%);
            color: #051333;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(36, 109, 237, 0.35);
            transition: transform .14s ease, filter .14s ease;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.04);
        }

        .card {
            border: 1px solid #2b3a67;
            background: #152146;
            border-radius: 12px;
            padding: 12px;
            margin: 10px 0;
        }

        .error, .success {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid transparent;
            font-weight: 500;
        }

        .error {
            color: #ffd3dc;
            background: rgba(255, 120, 144, 0.12);
            border-color: rgba(255, 120, 144, 0.36);
        }

        .success {
            color: #cffce1;
            background: rgba(76, 211, 143, 0.13);
            border-color: rgba(76, 211, 143, 0.35);
        }

        @media (max-width: 900px) {
            .split { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>DataShield Workspace</h1>
    <p class="lead">Interfaz compacta para registrar usuarios, enviar reportes y buscar incidentes verificados.</p>

    <div class="split">
        <section class="panel">
            <h2>Registro</h2>
            <label for="regName">Nombre</label>
            <input type="text" id="regName" placeholder="Tu nombre">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" placeholder="correo@ejemplo.com">
            <label for="regPassword">Contrasena</label>
            <input type="password" id="regPassword" placeholder="******">
            <button onclick="register()">Crear cuenta</button>
        </section>

        <section class="panel">
            <h2>Sesion</h2>
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="correo@ejemplo.com">
            <label for="loginPassword">Contrasena</label>
            <input type="password" id="loginPassword" placeholder="******">
            <button onclick="login()">Entrar</button>
        </section>
    </div>

    <div id="authResult"></div>

    <div id="reportSection" style="display:none;">
        <div class="panel">
            <h2>Crear reporte</h2>
            <label for="reportTitle">Titulo</label>
            <input type="text" id="reportTitle" placeholder="Tipo de estafa">
            <label for="reportDesc">Descripcion</label>
            <textarea id="reportDesc" placeholder="Detalla el incidente"></textarea>
            <label for="reportPhone">Telefono (opcional)</label>
            <input type="text" id="reportPhone" placeholder="+57 ...">
            <label for="reportEmail">Email (opcional)</label>
            <input type="email" id="reportEmail" placeholder="fraude@email.com">
            <label for="reportBank">Cuenta bancaria (opcional)</label>
            <input type="text" id="reportBank" placeholder="Numero de cuenta">
            <button onclick="createReport()">Enviar reporte</button>
        </div>

        <div class="panel">
            <h2>Buscar reportes</h2>
            <label for="searchPhone">Telefono</label>
            <input type="text" id="searchPhone" placeholder="Buscar por telefono">
            <label for="searchEmail">Email</label>
            <input type="email" id="searchEmail" placeholder="Buscar por email">
            <label for="searchBank">Cuenta bancaria</label>
            <input type="text" id="searchBank" placeholder="Buscar por cuenta">
            <button onclick="searchReports()">Buscar coincidencias</button>
            <div id="reportsList"></div>
        </div>
    </div>
</div>

<script>
    let token = null;
    const API_BASE = window.__API_BASE__
        || (window.location.protocol === 'file:' ? 'http://localhost:3000/api' : `${window.location.origin}/api`);

    function setMessage(containerId, message, type = 'error') {
        const container = document.getElementById(containerId);
        container.className = type;
        container.textContent = message;
    }

    function createReportCard(report) {
        const card = document.createElement('div');
        card.className = 'card';

        const title = document.createElement('strong');
        title.textContent = report.title || '';
        card.appendChild(title);
        card.appendChild(document.createElement('br'));

        const description = document.createElement('span');
        description.textContent = report.description || '';
        card.appendChild(description);
        card.appendChild(document.createElement('br'));

        const phone = document.createElement('span');
        phone.textContent = `Teléfono: ${report.phoneNumber || 'N/A'}`;
        card.appendChild(phone);
        card.appendChild(document.createElement('br'));

        const email = document.createElement('span');
        email.textContent = `Email: ${report.email || 'N/A'}`;
        card.appendChild(email);
        card.appendChild(document.createElement('br'));

        const status = document.createElement('span');
        status.textContent = `Estado: ${report.status || 'PENDING'}`;
        card.appendChild(status);

        return card;
    }

    async function request(endpoint, method, body = null, auth = false) {
        const headers = { 'Content-Type': 'application/json' };
        if (auth && token) headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch(`${API_BASE}${endpoint}`, {
            method,
            headers,
            body: body ? JSON.stringify(body) : null
        });
        const responseText = await res.text();
        let data = {};
        try {
            data = responseText ? JSON.parse(responseText) : {};
        } catch (error) {
            data = {};
        }

        if (res.status === 401) {
            token = null;
            document.getElementById('reportSection').style.display = 'none';
            throw new Error('Sesión expirada. Inicia sesión nuevamente.');
        }

        if (!res.ok) throw new Error(data.message || `Error (${res.status})`);
        return data;
    }

    async function register() {
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        try {
            const data = await request('/auth/register', 'POST', { email, password, name });
            setMessage('authResult', `Usuario registrado: ${data.user.email}`, 'success');
        } catch (err) {
            setMessage('authResult', err.message, 'error');
        }
    }

    async function login() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        try {
            const data = await request('/auth/login', 'POST', { email, password });
            token = data.token;
            setMessage('authResult', `Sesión iniciada como ${data.user.email}. Token guardado.`, 'success');
            document.getElementById('reportSection').style.display = 'block';
        } catch (err) {
            setMessage('authResult', err.message, 'error');
        }
    }

    async function createReport() {
        if (!token) { alert('Inicia sesión primero'); return; }
        const title = document.getElementById('reportTitle').value;
        const description = document.getElementById('reportDesc').value;
        const phoneNumber = document.getElementById('reportPhone').value;
        const email = document.getElementById('reportEmail').value;
        const bankAccount = document.getElementById('reportBank').value;
        try {
            const data = await request('/reports', 'POST', { title, description, phoneNumber, email, bankAccount, evidenceUrls: [] }, true);
            alert('Reporte creado con ID: ' + data.id);
        } catch (err) {
            alert('Error: ' + err.message);
        }
    }

    async function searchReports() {
        if (!token) { alert('Inicia sesión primero'); return; }
        const phoneNumber = document.getElementById('searchPhone').value;
        const email = document.getElementById('searchEmail').value;
        const bankAccount = document.getElementById('searchBank').value;
        let url = '/reports/search?';
        if (phoneNumber) url += `phoneNumber=${encodeURIComponent(phoneNumber)}&`;
        if (email) url += `email=${encodeURIComponent(email)}&`;
        if (bankAccount) url += `bankAccount=${encodeURIComponent(bankAccount)}&`;
        try {
            const data = await request(url, 'GET', null, true);
            const reportsList = document.getElementById('reportsList');
            if (data.reports.length === 0) {
                reportsList.className = '';
                reportsList.textContent = 'No se encontraron reportes.';
            } else {
                reportsList.className = '';
                reportsList.textContent = '';
                data.reports.forEach((report) => {
                    reportsList.appendChild(createReportCard(report));
                });
            }
        } catch (err) {
            setMessage('reportsList', err.message, 'error');
        }
    }
</script>
</body>
</html>
